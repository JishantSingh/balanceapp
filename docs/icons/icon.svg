<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- bahi: the red cloth-bound ledger book -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#a6392b"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#7d2a1f" stroke-width="8"/>
  <!-- stitched spine -->
  <line x1="112" y1="56" x2="112" y2="456" stroke="#f5f0e4" stroke-width="10" stroke-dasharray="26 22" stroke-linecap="round" opacity="0.85"/>
  <!-- cream label patch, slightly tilted -->
  <g transform="rotate(-2 296 236)">
    <rect x="176" y="146" width="248" height="180" rx="14" fill="#f5f0e4"/>
    <rect x="176" y="146" width="248" height="180" rx="14" fill="none" stroke="#d9d0ba" stroke-width="6"/>
    <line x1="204" y1="200" x2="396" y2="200" stroke="#23201a" stroke-width="14" stroke-linecap="round"/>
    <line x1="204" y1="242" x2="396" y2="242" stroke="#a89e88" stroke-width="9" stroke-linecap="round"/>
    <line x1="204" y1="280" x2="330" y2="280" stroke="#a89e88" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- double rule at the base -->
  <line x1="160" y1="392" x2="432" y2="392" stroke="#f5f0e4" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <line x1="160" y1="416" x2="432" y2="416" stroke="#f5f0e4" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
